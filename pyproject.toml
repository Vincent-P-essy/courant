[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courant"
version = "0.1.0"
description = "A production-shaped open-data pipeline for the French electricity grid: data contracts, an incremental DuckDB warehouse, and a read API — state fits in one file."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Vincent Plessy", email = "vincent.plessy12@gmail.com" }]
keywords = ["data-engineering", "duckdb", "open-data", "pipeline", "data-quality", "energy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "click>=8.1",
  "duckdb>=1.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pytz>=2024.1",  # duckdb requires it to materialise TIMESTAMPTZ values
  "rich>=13.7",
  "uvicorn>=0.30",
]

[project.scripts]
courant = "courant.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/courant"
Issues = "https://github.com/Vincent-P-essy/courant/issues"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/courant"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/courant"]

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "uvicorn", "uvicorn.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["courant"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
